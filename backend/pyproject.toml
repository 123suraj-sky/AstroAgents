[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "astroagents-backend"
version = "0.1.0"
description = "FastAPI backend for AstroAgents"
requires-python = ">=3.10"
dependencies = [
	"fastapi>=0.115,<1.0",
	"uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
dev = [
	# Linting & formatting
	"ruff>=0.4.0",
	# Type checking
	"mypy>=1.10.0",
	# Testing
	"pytest>=8.0.0",
	"pytest-cov>=5.0.0",
	"pytest-asyncio>=0.23.0",
	"httpx>=0.27.0",       # async test client for FastAPI
	# Build
	"build>=1.2.0",
]
